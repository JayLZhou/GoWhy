<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="GoWhy: the causal database for AI agents">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
    <marker id="m" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <g transform="translate(168 124)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <!-- hidden confounder: its edge into the action is cut by do() -->
    <line x1="-14" y1="-48" x2="-52" y2="8" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 7"/>
    <line x1="14" y1="-48" x2="52" y2="8" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#m)"/>
    <g stroke="#a78bfa" stroke-width="4" stroke-linecap="round">
      <line x1="-46" y1="-34" x2="-22" y2="-18"/>
      <line x1="-52" y1="-24" x2="-28" y2="-8"/>
    </g>
    <line x1="-38" y1="38" x2="36" y2="38" stroke="#a78bfa" stroke-width="5" marker-end="url(#a)"/>
    <circle cx="0" cy="-66" r="22" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="6 6"/>
    <text x="0" y="-58" font-size="22" fill="#9ca3af">?</text>
    <circle cx="-68" cy="38" r="30" fill="#a78bfa"/>
    <text x="-68" y="45" font-size="20" fill="#1e1b4b">do</text>
    <circle cx="68" cy="38" r="30" fill="none" stroke="#f3f4f6" stroke-width="4"/>
    <text x="68" y="46" font-size="24" fill="#f3f4f6">Y</text>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="318" y="134" font-size="104" font-weight="800" letter-spacing="-3" fill="#f3f4f6">Go<tspan fill="#a78bfa">Why</tspan></text>
    <text x="324" y="184" font-size="25" fill="#9ca3af">Ask what-if before acting. Answer why after.</text>
  </g>
</svg>
